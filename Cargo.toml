[workspace]
members = ["crates/texzi-app", "crates/texzi-document"]
exclude = ["vendor/markdown", "vendor/nsh-base", "vendor/nsh-platform-windows"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "f78eace7af23a9c1c72605c7ee46204f57f3e8e6", default-features = false }
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "f78eace7af23a9c1c72605c7ee46204f57f3e8e6", default-features = false, features = ["editor", "rich-editor", "net", "svg"] }
log = "=0.4.29"

[patch."https://github.com/longbridge/nsh"]
nsh-base = { path = "vendor/nsh-base" }
nsh-platform-windows = { path = "vendor/nsh-platform-windows" }

[patch.crates-io]
markdown = { path = "vendor/markdown" }

