<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">texzi 文档事务与渲染关系</title>
<desc id="desc">窗口视图经命令事务写入唯一DocumentStore。文本布局和Markdown投影返回视图；不可变快照供搜索保存恢复任务使用，结果返回事务入口。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f87a7"/></marker></defs>
<g fill="none" stroke="#6f87a7" stroke-width="2" marker-end="url(#arrow)">
<path d="M390 70V120"/><path d="M390 170V220"/>
<path d="M350 270V295H160V320"/><path d="M430 270V295H610V320"/>
<path d="M610 370V420"/><path d="M20 345H10V45H270"/>
<path d="M750 445H785V145H510"/>
</g>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" text-anchor="middle" fill="#26354a">
<g><rect x="270" y="20" width="240" height="50" rx="5" fill="#f7f8fa" stroke="#cbd4e1"/><text x="390" y="51">窗口 / 编辑视图</text></g>
<g><rect x="270" y="120" width="240" height="50" rx="5" fill="#f7f8fa" stroke="#cbd4e1"/><text x="390" y="151">命令与事务入口</text></g>
<g><rect x="270" y="220" width="240" height="50" rx="5" fill="#e5eefc" stroke="#3267b0" stroke-width="2"/><text x="390" y="251">唯一 DocumentStore</text></g>
<g><rect x="20" y="320" width="280" height="50" rx="5" fill="#f7f8fa" stroke="#cbd4e1"/><text x="160" y="351">文本布局 / Markdown 投影</text></g>
<g><rect x="470" y="320" width="280" height="50" rx="5" fill="#f7f8fa" stroke="#cbd4e1"/><text x="610" y="351">不可变版本快照</text></g>
<g><rect x="470" y="420" width="280" height="50" rx="5" fill="#f7f8fa" stroke="#cbd4e1"/><text x="610" y="451">搜索 / 文件保存 / 恢复任务</text></g>
</g>
</svg>
