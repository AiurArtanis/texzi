[package]
name = "texzi-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
memchr = "=2.8.3"
pcre2-sys = "=0.2.10"
regex-syntax = { version = "=0.8.11", default-features = false, features = ["std", "unicode-case", "unicode-gencat"] }
ropey = { version = "=1.6.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[test]]
name = "pcre_worker"
path = "tests/pcre_worker.rs"
harness = false
