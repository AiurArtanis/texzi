[package]
name = "texzi-document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ropey = { version = "=1.6.1", default-features = false }
unicode-segmentation = "=1.13.3"
encoding_rs = "=0.8.44"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Wdk_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Threading"] }

# In-memory verification executable only; not used by the default library.
[[bin]]
name = "document-probe"
path = "src/bin/document-probe.rs"
required-features = ["probe"]

[features]
default = []
probe = ["dep:serde_json"]

[dependencies.serde_json]
version = "=1.0.154"
optional = true
