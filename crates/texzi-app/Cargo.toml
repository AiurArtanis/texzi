[package]
name = "texzi-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
log.workspace = true
texzi-document = { path = "../texzi-document" }
markdown = "=1.0.0"
serde_json = "=1.0.154"
imara-diff = "=0.2.0"
unicode-segmentation = "=1.13.3"

[target.'cfg(windows)'.dependencies]
nsh-core.workspace = true
nsh-platform-windows.workspace = true
nsh-base = { path = "../../vendor/nsh-base", default-features = false, features = ["editor", "rich-editor"] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt"] }
