<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>texzi · 交互原型</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--window:#f3f4f6;--sidebar:#f7f8fa;--editor:#fff;--text:#20242b;--muted:#616975;--border:#dee2e8;--accent:#3267b0;--accent-soft:#dceafe;--hover:#edf1f6;--selection:#dceafe;--match:#fff0b7;--current-match:#f4cd6a;--danger:#b93838;--warn:#966c19;--code-string:#267346;--code-key:#6943a5;--code-number:#955a16;--shadow:0 10px 30px #1722351a;--font-ui:"Segoe UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif;--font-code:"Cascadia Mono","Consolas","Noto Sans Mono","Microsoft YaHei",monospace;--font-size:16px;--line-height:24px;--sidebar-width:232px;--radius:5px;--ui-scale:1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#e9edf2;color:var(--text);font-family:var(--font-ui);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:transparent;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.42;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:hover{background:var(--hover)}
input,select{background:var(--editor);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;min-width:0}
input::placeholder{color:var(--muted);opacity:.9}
kbd{font-family:var(--font-ui);font-size:11px;font-weight:400;color:var(--muted);white-space:nowrap}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
.icon-button{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;flex-shrink:0}
.icon-button svg{width:17px;height:17px}
.icon-button.active,.toggle-button.active{background:var(--accent-soft);color:var(--accent)}
#reviewbar{height:50px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:#435065}
.review-brand{display:flex;align-items:center;gap:9px}
.review-brand strong{font-size:19px;letter-spacing:-.6px;color:#28374b}
.review-brand>span:last-child{font-size:12px;color:#647185}
.brand-dot{width:7px;height:7px;border-radius:50%;background:#3267b0}
.scene-nav{display:flex;gap:3px;border:1px solid #d1d9e3;border-radius:7px;padding:3px;background:#f4f6f9}
.scene-nav button{font-size:12px;border-radius:4px;padding:5px 13px}
.scene-nav button.selected{background:#fff;box-shadow:0 1px 3px #19335618;color:#1f4e8c}
.review-help{font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:7px}
#app{height:calc(100dvh - 62px);margin:0 12px 12px;background:var(--editor);border:1px solid #c8cfd8;border-radius:8px;box-shadow:0 2px 8px #22304712;overflow:hidden;display:flex;flex-direction:column;position:relative;min-width:620px}
.titlebar{height:44px;min-height:44px;background:var(--window);display:flex;align-items:center;border-bottom:1px solid var(--border);user-select:none}
.app-icon{width:44px;min-width:44px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.app-icon svg{width:21px;height:23px}
#menubar{display:flex;height:100%;align-items:center;gap:0}
.menubar-button{height:30px;border-radius:4px;padding:0 10px;font-size:13px}
.menubar-button.open{background:var(--hover)}
.quick-open{margin-left:clamp(12px,5vw,100px);width:clamp(210px,31vw,520px);max-width:520px;height:29px;display:flex;gap:9px;align-items:center;border:1px solid #c7cdd6;border-radius:5px;color:var(--muted);background:var(--editor);padding:0 10px;text-align:left}
.quick-open>span:nth-child(2){flex:1}
.quick-open svg{width:16px;height:16px}
.drag-space{flex:1;min-width:18px;height:100%}
.window-actions{height:100%;display:flex}
.window-actions button{width:43px;height:100%;font-size:19px;font-weight:300;border-radius:0}
.window-actions button:last-child:hover{background:#c83d3d;color:#fff}
.workbench{flex:1;min-height:0;display:flex}
.activitybar{width:44px;min-width:44px;background:var(--window);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:stretch}
.activitybar button{height:48px;display:flex;justify-content:center;align-items:center;position:relative;color:var(--muted);flex-shrink:0}
.activitybar button svg{width:23px;height:23px}
.activitybar button.active{color:var(--text)}
.activitybar button.active:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--accent)}
.activitybar button:last-child.active{color:var(--accent)}
.activity-spacer{flex:1}
#sidebar{width:var(--sidebar-width);min-width:0;background:var(--sidebar);overflow:auto;flex-shrink:0;display:flex;flex-direction:column}
.sidebar-heading{height:38px;min-height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;font-size:12px;font-weight:600}
.sidebar-heading .actions{display:flex;opacity:.2}
#sidebar:hover .sidebar-heading .actions{opacity:1}
.sidebar-section{padding:7px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.sidebar-section svg{width:13px;height:13px}
.tree{padding:0 7px;user-select:none}
.tree-row{height:29px;display:flex;align-items:center;gap:7px;border-radius:4px;cursor:pointer;padding-right:7px;min-width:0}
.tree-row:hover{background:var(--hover)}
.tree-row.active{background:var(--accent-soft);color:var(--text)}
.tree-row .file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-row .dirty{margin-left:auto}
.tree-row svg{width:16px;height:17px;color:var(--muted)}
.tree-arrow{font-size:13px;width:12px;flex-shrink:0;text-align:center}
.tree-row.level0{padding-left:8px}.tree-row.level1{padding-left:23px}.tree-row.level2{padding-left:43px}
.sidebar-note{padding:14px;color:var(--muted);font-size:12px;line-height:1.7;margin-top:auto;border-top:1px solid var(--border)}
.sidebar-note button{display:block;margin-top:7px;color:var(--accent);padding:0}
.sidebar-resizer{width:3px;min-width:3px;cursor:col-resize;background:var(--border);opacity:.65;position:relative;z-index:3}
.sidebar-resizer:hover{background:var(--accent);opacity:1}
#workspace{flex:1;min-width:0;min-height:0;position:relative;display:flex;overflow:hidden;background:var(--editor)}
.layout-split{display:flex;flex:1;min-width:0;min-height:0}
.split-left{width:64%;min-width:230px;display:flex;min-height:0}
.split-right{flex:1;display:flex;flex-direction:column;min-width:200px;min-height:0}
.split-right .editor-group:first-child{flex:1.08}
.split-right .editor-group:last-child{flex:1}
.split-handle{width:4px;min-width:4px;background:var(--border);cursor:col-resize;position:relative;z-index:4}
.split-handle.horizontal{height:4px;min-height:4px;width:100%;cursor:row-resize}
.split-handle:hover{background:var(--accent)}
.editor-group{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--editor)}
.tabbar{height:38px;min-height:38px;display:flex;background:var(--window);border-bottom:1px solid var(--border);user-select:none}
.tab-list{display:flex;flex:1;min-width:0;overflow:hidden}
.tab{position:relative;display:flex;align-items:center;gap:7px;padding:0 12px;min-width:104px;max-width:210px;border-right:1px solid var(--border);height:38px;font-size:13px;cursor:pointer}
.tab .tab-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tab.preview .tab-name{font-style:italic}
.tab.active{background:var(--editor)}
.editor-group.focused .tab.active:after{content:"";position:absolute;height:2px;bottom:0;left:0;right:0;background:var(--accent)}
.tab-close{width:18px;height:20px;padding:0;border-radius:3px;font-size:17px;opacity:.15;display:flex;align-items:center;justify-content:center}
.tab:hover .tab-close,.tab.active .tab-close{opacity:.85}
.tab .dirty{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.tab.pinned:before{content:"◆";font-size:9px;color:var(--muted)}
.tab-actions{display:flex;align-items:center;padding:0 5px;gap:1px}
.breadcrumb{height:29px;min-height:29px;font-size:12px;display:flex;align-items:center;gap:7px;padding:0 16px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breadcrumb>span:last-child{color:var(--text);overflow:hidden;text-overflow:ellipsis}
.editor-content{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}
.source-wrap{display:flex;flex:1;min-width:0;min-height:0;position:relative}
.line-numbers{width:57px;min-width:57px;padding:18px 12px 100px 0;text-align:right;color:#7b8490;background:var(--editor);font-family:var(--font-code);font-size:13px;line-height:var(--line-height);overflow:hidden;user-select:none;white-space:pre;position:relative;border-right:1px solid transparent}
.source-scroll{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden}
.source-highlight,.source-input{position:absolute;inset:0;margin:0;border:0;padding:18px 20px 100px 8px;font-family:var(--font-code);font-size:var(--font-size);line-height:var(--line-height);font-weight:400;letter-spacing:0;tab-size:4;white-space:pre;overflow:auto;overflow-wrap:normal;border-radius:0;text-rendering:auto;font-variant-ligatures:none}
.source-highlight{pointer-events:none;z-index:1;color:var(--text);scrollbar-width:none;background:var(--editor)}
.source-highlight::-webkit-scrollbar{display:none}
.source-input{resize:none;background:transparent;color:transparent;caret-color:var(--accent);z-index:2;outline:none!important;-webkit-text-fill-color:transparent}
.source-input::selection{background:#8fbaed66;color:transparent}
.source-input.wrap,.source-highlight.wrap{white-space:pre-wrap;overflow-wrap:break-word}
.source-input[readonly]{caret-color:transparent}
.source-highlight .kw{color:var(--code-key)}.source-highlight .str{color:var(--code-string)}.source-highlight .num{color:var(--code-number)}
mark{background:var(--match);color:inherit;padding:0;border-radius:1px}
mark.current{background:var(--current-match);box-shadow:inset 0 0 0 1px #a87919}
.source-highlight .multi-selection{background:var(--accent-soft);border-left:2px solid var(--accent)}
.source-highlight .active-line{background:#f2f6fb}
.md-toggle{position:absolute;right:21px;top:12px;z-index:5;border:1px solid var(--border);background:var(--editor);width:34px;height:29px;border-radius:4px;font-family:var(--font-code);font-size:17px;font-weight:600;box-shadow:0 1px 2px #16273808}
.md-toggle.active{background:var(--accent-soft);color:var(--accent);border-color:#9bb9df}
.md-toggle:hover{background:var(--hover)}
.rich-scroll{flex:1;min-width:0;min-height:0;overflow:auto;position:relative;padding:37px 40px 100px}
.rich-document{max-width:800px;margin:auto;font-size:16px;line-height:1.8;outline:0}
.rich-document h1{font-size:24px;letter-spacing:-.5px;font-weight:650;line-height:1.4;margin:0 0 16px}
.rich-document h2{font-size:20px;font-weight:650;line-height:1.4;margin:28px 0 12px}
.rich-document h3{font-size:18px;margin:23px 0 10px}
.rich-document p{margin:10px 0}
.rich-document [data-block]{outline:none;border-radius:2px}
.rich-document [data-block]:focus{box-shadow:-2px 0 0 #b6ceef;padding-left:7px;margin-left:-7px}
.rich-document strong{font-weight:650}
.rich-document ul,.rich-document ol{padding-left:24px;margin:10px 0 18px}
.rich-document li{padding:3px 0}
.rich-document .task-list{list-style:none;padding:0}
.rich-document .task-list li{display:flex;align-items:flex-start;gap:10px;padding:4px 0}
.task-box{accent-color:var(--accent);width:17px;height:17px;margin-top:7px;flex-shrink:0;padding:0}
.task-text{min-width:0;flex:1;outline:0}
.rich-document code{font-family:var(--font-code);font-size:.9em;background:var(--window);padding:2px 5px;border-radius:3px}
.rich-document pre{padding:14px 18px;background:var(--window);border-radius:5px;font-size:14px;line-height:1.6;overflow:auto;white-space:pre;margin:16px 0}
.rich-document pre code{padding:0;background:none;display:block;outline:0}
.rich-document table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
.rich-document th,.rich-document td{padding:8px 12px;border:1px solid var(--border);text-align:left;outline:0}
.rich-document th{background:var(--window);font-weight:600}
.rich-document td:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.rich-document blockquote{margin:15px 0;border-left:3px solid #bbc9d8;padding:3px 16px;color:var(--muted)}
.rich-document a{color:var(--accent);text-underline-offset:3px}
.rich-document hr{border:0;border-top:1px solid var(--border);margin:22px 0}
.raw-block{border:1px dashed #b7bec8;padding:10px 14px;background:var(--window);margin:12px 0}
.raw-block .raw-label{font-size:11px;color:var(--muted);margin-bottom:5px}
.raw-block pre{margin:0;padding:0;font-size:13px}
::highlight(texzi-search){background:var(--match);color:var(--text)}
::highlight(texzi-current){background:var(--current-match);color:var(--text)}
.find-widget{position:absolute;top:9px;right:17px;z-index:10;min-width:415px;max-width:calc(100% - 28px);padding:6px;background:var(--window);border:1px solid var(--border);border-radius:5px;box-shadow:0 3px 10px #14223812}
.find-row{display:flex;gap:3px;align-items:center}
.find-row+.find-row{margin-top:5px}
.find-field{display:flex;flex:1;align-items:center;background:var(--editor);border:1px solid var(--border);border-radius:3px;min-width:70px}
.find-field:focus-within{border-color:var(--accent)}
.find-field input{width:100%;flex:1;border:0;outline:0;padding:5px 7px;min-width:60px;background:transparent}
.find-options{display:flex;gap:1px;padding-right:3px}
.find-options button{font-size:12px;min-width:24px;height:24px;border-radius:3px;padding:2px 3px}
.find-options button.active{background:var(--accent-soft);color:var(--accent)}
.find-result{font-size:11px;color:var(--muted);width:60px;text-align:center}
.find-scope{font-size:10px;letter-spacing:.5px;padding:3px 5px;color:var(--muted);border:1px solid var(--border);border-radius:3px}
.find-error{font-size:12px;color:var(--danger);padding:5px 2px 1px;max-width:430px;white-space:normal}
.find-actions{display:flex;gap:3px;justify-content:flex-end;padding:0 3px}
.find-actions button{font-size:11px;padding:5px 7px;border:1px solid var(--border);border-radius:3px;background:var(--editor)}
.inline-banner{padding:9px 15px;font-size:12px;line-height:1.6;display:flex;align-items:center;gap:10px;background:#fff5d9;border-bottom:1px solid #e3ce95;color:#6f521b;flex-wrap:wrap}
.inline-banner.info{background:#edf4ff;border-color:#c5d9f3;color:#345d8b}
.inline-banner.error{background:#fff0ed;border-color:#e9bbb3;color:#963e32}
.inline-banner>span{flex:1;min-width:100px}
.inline-banner button{font-size:12px;border:1px solid currentColor;padding:3px 8px;border-radius:3px}
.statusbar{height:24px;min-height:24px;border-top:1px solid var(--border);background:var(--window);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;user-select:none;padding:0 9px}
#status-left,#status-right{display:flex;gap:3px;align-items:center;white-space:nowrap;min-width:0}
.statusbar button{padding:3px 6px;font-size:11px;border-radius:3px}
#status-left .status-dot{width:5px;height:5px;border-radius:50%;background:#6a9870;margin:0 5px}
.menu{position:fixed;z-index:120;background:var(--editor);border:1px solid var(--border);border-radius:6px;box-shadow:var(--shadow);min-width:245px;padding:5px;max-height:75vh;overflow:auto}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:7px 10px;border-radius:3px;font-size:13px}
.menu-item>span:first-child{flex:1}
.menu-item:disabled{opacity:.45}
.menu-separator{height:1px;background:var(--border);margin:4px 5px}
.menu-section{font-size:11px;color:var(--muted);padding:6px 10px}
.backdrop{position:fixed;inset:0;background:#131d2f30;z-index:140;display:flex;align-items:center;justify-content:center;padding:20px}
.dialog{width:520px;max-width:100%;max-height:87vh;overflow:auto;background:var(--editor);border:1px solid var(--border);border-radius:8px;box-shadow:0 18px 70px #14253b33;padding:24px}
.dialog.wide{width:850px}
.dialog h2{font-size:21px;margin:0 0 12px;letter-spacing:-.3px}
.dialog p{line-height:1.8;font-size:13px;color:var(--muted)}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.button,.dialog-actions button{padding:7px 13px;border:1px solid var(--border);border-radius:4px;background:var(--window);font-size:13px}
.primary,.dialog-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.dialog-actions button.danger{color:var(--danger)}
.dialog-close{float:right;margin:-6px -7px 0 12px;font-size:23px;width:28px;height:28px;border-radius:4px}
.dialog table{width:100%;border-collapse:collapse;font-size:12px;line-height:1.7}
.dialog th,.dialog td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.dialog th{background:var(--window)}
.dialog code{font-size:12px;padding:1px 4px;background:var(--window);font-family:var(--font-code)}
.dialog .field{display:flex;flex-direction:column;gap:7px;margin:14px 0;font-size:13px}
.dialog .field input{width:100%}
.palette-backdrop{align-items:flex-start;padding-top:110px;background:#14223820}
.command-palette{width:600px;padding:8px;overflow:hidden}
.command-palette input{width:100%;height:37px;font-size:14px;border-color:var(--accent)}
.palette-results{max-height:390px;overflow:auto;margin-top:6px}
.palette-item{display:flex;gap:12px;align-items:center;padding:10px 11px;width:100%;text-align:left;border-radius:4px}
.palette-item.selected{background:var(--accent-soft)}
.palette-item strong{font-size:13px;font-weight:500}
.palette-item span:last-child{margin-left:auto;font-size:11px;color:var(--muted)}
.palette-hint{font-size:11px;padding:9px 11px 3px;color:var(--muted)}
#toast{position:fixed;bottom:43px;right:28px;z-index:200;padding:10px 15px;border:1px solid var(--border);background:var(--editor);box-shadow:var(--shadow);border-radius:5px;font-size:12px;max-width:520px;line-height:1.7;transform:translateY(12px);opacity:0;transition:opacity .14s,transform .14s;pointer-events:none}
#toast.visible{opacity:1;transform:translateY(0)}
.settings-page{display:flex;flex:1;flex-direction:column;min-width:0;min-height:0}
.settings-scroll{flex:1;overflow:auto;padding:24px 36px 60px}
.settings-content{max-width:1060px;margin:0 auto}
.settings-top{display:flex;align-items:center;gap:24px;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--border);position:sticky;top:-24px;background:var(--editor);z-index:3;padding-top:3px}
.settings-top h1{font-size:23px;margin:0;font-weight:600}
.settings-top input{width:340px;max-width:50%;font-size:13px}
.settings-group h2{font-size:16px;font-weight:600;margin:24px 0 3px}
.setting-row{display:flex;align-items:center;gap:25px;min-height:58px;padding:11px 0;border-bottom:1px solid var(--border)}
.setting-label{flex:1;min-width:0;line-height:1.4}
.setting-name{font-size:14px}
.setting-desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6}
.setting-control{width:230px;flex-shrink:0;display:flex;align-items:center;gap:8px}
.setting-control select,.setting-control input[type=text],.setting-control input[type=number]{width:100%;font-size:13px}
.setting-control input[type=number]{max-width:110px}
.switch{position:relative;width:37px;height:21px;border-radius:12px;background:#a6adb6;padding:0;transition:background .12s;border:0;flex-shrink:0}
.switch:after{position:absolute;content:"";left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .12s}
.switch.on{background:var(--accent)}
.switch.on:after{transform:translateX(16px)}
.switch:hover{filter:brightness(.96)}
.settings-nav{padding:8px 10px}
.settings-nav button{display:flex;align-items:center;width:100%;padding:11px 10px;gap:12px;font-size:14px;border-radius:4px;text-align:left;margin-bottom:3px}
.settings-nav button svg{width:19px;height:19px}
.settings-nav button.selected{background:var(--accent-soft)}
.settings-empty{text-align:center;padding:60px 15px;color:var(--muted)}
.shortcut-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}
.shortcut-table th,.shortcut-table td{border-bottom:1px solid var(--border);padding:12px 8px;text-align:left;line-height:1.6}
.shortcut-table th{color:var(--muted);font-weight:500}
.shortcut-key{display:inline-block;padding:2px 5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:3px;margin:0 2px 2px 0;background:var(--window);font-family:var(--font-ui)}
.folder-search{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.folder-search input{width:100%;font-size:13px}
.folder-results{overflow:auto;padding:0 5px}
.folder-result{display:block;width:100%;padding:8px;text-align:left;border-radius:4px;font-size:12px}
.folder-result .file{display:block;font-weight:600;margin-bottom:4px}
.folder-result .snippet{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-editor{display:flex;align-items:center;justify-content:center;flex:1;text-align:center;color:var(--muted)}
.empty-editor h1{font-size:38px;font-weight:550;letter-spacing:-1.8px;margin-bottom:20px;color:#6c788b}
.empty-editor button{display:flex;justify-content:space-between;gap:28px;padding:10px 15px;width:280px;border-radius:4px;font-size:13px}

  d.demoLarge=true;d.banner='large';d.readOnly=false;state.groups=[makeGroup('g1',[d.id])];state.activeGroup='g1';
 }else if(type==='external'){
  const d=docById('todo')||state.docs[0];d.externalSource=d.savedSource+'\n外部程序追加：会议调整为 10:30。\n';editDocument(d,d.source+'\n本地编辑：补充验收事项。\n','scenario',true);d.banner='external';state.groups=[makeGroup('g1',[d.id])];state.activeGroup='g1';
 }else if(type==='recovery'){
  const id='recovery-'+Date.now(),d=makeDocument(id,'未命名-恢复','', '恢复的临时记录\n\n下午与团队确认：\n1. Markdown 所见即所得\n2. Win10 x64\n3. 中文输入法与异常恢复\n',true);d.banner='recovery';state.docs.push(d);state.groups=[makeGroup('g1',[id])];state.activeGroup='g1';
 }else if(type==='readonly'||type==='save-error'){
  const d=docById('todo')||state.docs[0];d.banner=type;d.readOnly=type==='readonly';state.groups=[makeGroup('g1',[d.id])];state.activeGroup='g1';
 }else if(type==='multi'){
  let d=docById('multi-demo');if(!d){d=makeDocument('multi-demo','批量编辑.json','日常文字/片段/批量编辑.json','{\n  "title": "alpha",\n  "label": "alpha",\n  "group": "alpha"\n}');state.docs.push(d);}
  state.groups=[makeGroup('g1',[d.id])];state.activeGroup='g1';renderAll();const ta=activeTextarea(),at=d.source.indexOf('alpha');ta.focus();ta.setSelectionRange(at,at+5);addNextSelection(true);return;
 }else if(type==='raw'){
  let d=docById('raw-demo');if(!d){d=makeDocument('raw-demo','语法保留.md','日常文字/工作笔记/语法保留.md','---\ntitle: texzi\ncustom: keep-me\n---\n\n# 原文保留演示\n\n普通段落可以直接编辑。\n\n::: custom-widget\n这个未知扩展块保留原始文本。\n:::\n\n'+TICK.repeat(3)+'mermaid\nflowchart LR\n  A --> B\n'+TICK.repeat(3)+'\n');state.docs.push(d);}
  state.groups=[makeGroup('g1',[d.id])];state.activeGroup='g1';
 }
 state.sidebar='files';state.sidebarVisible=true;renderAll();
}

 showMenu(anchor,[['模拟大文件模式','',function(){scenario('large');}],['模拟外部文件变更','',function(){scenario('external');}],['模拟异常恢复','',function(){scenario('recovery');}],['模拟只读文件','',function(){scenario('readonly');}],['模拟保存失败','',function(){scenario('save-error');}],null,['多光标批量编辑','可编辑',function(){scenario('multi');}],['未知 Markdown 语法保留','可编辑',function(){scenario('raw');}],['深色主题','',function(){updateSetting('appearance.theme','dark');}],['Zen 专注模式','',toggleZen]]);
}
function showPrototypeHelp(){
 showDialog('原型功能说明','<p>这是 texzi 的可运行交互原型，供审阅界面与行为。最终应用采用 NSH；此页面使用浏览器技术。</p><table><thead><tr><th>能力</th><th>当前原型</th></tr></thead><tbody><tr><td>文本输入、撤销、查找替换</td><td>真实可操作；历史采用浏览器样本实现，正则为 JavaScript RegExp（500 ms 预算），与正式 PCRE2 方案不同。</td></tr><tr><td>Markdown 所见即所得</td><td>标题、段落、列表、任务、基础表格、代码块可编辑；按块回写源码；切换模式不改文档。不是完整 Typora／NSH 富文本内核。</td></tr><tr><td>多光标</td><td>可选择多个相同内容并同时输入、替换、退格；不覆盖矩形选区、完整 Unicode 与输入法组合语义。</td></tr><tr><td>文件与文件夹</td><td>导入 UTF-8 文件（每个最多5 MiB、最多100个），保存为下载副本。不会监听或覆盖本机原文件。</td></tr><tr><td>标签、分屏、设置、Zen</td><td>可切换、关闭、固定、拖动标签，最多3个演示区域；常用设置实际生效，其他设置保存配置值并注明。</td></tr><tr><td>恢复与外部变更</td><td>浏览器会话恢复可用；系统崩溃、文件监听、原子保存与冲突来源由“状态演示”模拟。</td></tr><tr><td>新窗口与性能</td><td>新建浏览器演示窗口；不证明 NSH 原生多窗口、TSF、DPI或100 MiB性能。</td></tr></tbody></table><div class="review-callout">原型内容只保存在当前浏览器的本地存储，可通过“帮助 → 重置演示数据”清除。直接关闭页面不会写入你的本机原文件。</div>',[['开始审阅',closeDialog,'primary']],true);
}
function showReviewGuide(){
 showDialog('建议审阅路径','<ol style="line-height:2;font-size:13px"><li>主界面：修改文本，查找“文本”，展开替换，再撤销。</li><li>分屏编辑：修改任务项或表格，点击正文右上 &gt;_，核对源码，然后撤销。</li><li>拖动标签到另一编辑区域，调整分隔线；通过菜单打开新窗口。</li><li>设置：切换深色主题、字号、换行；搜索“恢复”。</li><li>状态演示：外部变更 → 比较；恢复 → 保留；大文件 → 查看策略。</li><li>查看 → Zen；两次 Esc 退出并恢复布局。</li></ol>',[['关闭',closeDialog,'primary']]);
}
function resetDemo(){
 showDialog('重置演示数据','<p>清除当前原型保存的文档、设置和布局，恢复初始样本。此操作不影响你导入文件的原件。</p>',[['取消',closeDialog],['重置',function(){localStorage.removeItem(STORAGE_KEY);state.docs=initialDocuments();state.settings=Object.assign({},defaultSettings);closeDialog();switchScene('main');toast('已恢复初始演示数据。');},'danger']]);

function paletteEntries(commandsOnly){
 const commands=[
  ['新建文本','Ctrl+N',newDocument],['打开文件','Ctrl+O',function(){el('file-input').click();}],['打开文件夹','Ctrl+K Ctrl+O',function(){el('folder-input').click();}],
  ['Markdown：切换源码 / 所见即所得','>_',function(){toggleMarkdown();}],['拆分编辑区域','Ctrl+\\',splitCurrent],['Zen 模式','Ctrl+K Z',toggleZen],
  ['设置','Ctrl+,',function(){switchScene('settings');}],['查找','Ctrl+F',function(){openFind(false);}],['替换','Ctrl+H',function(){openFind(true);}],
  ['下载当前文件','Ctrl+S',function(){saveCurrent(false);}],['新建窗口','Ctrl+Shift+N',newWindow],['显示 / 隐藏侧栏','Ctrl+K Ctrl+B',toggleSidebar],
  ['主题：浅色','',function(){updateSetting('appearance.theme','light');}],['主题：深色','',function(){updateSetting('appearance.theme','dark');}],
  ['状态演示：外部变更','',function(){scenario('external');}],['状态演示：异常恢复','',function(){scenario('recovery');}],['状态演示：大文件','',function(){scenario('large');}],
  ['多光标批量编辑','',function(){scenario('multi');}],['原型说明','',showPrototypeHelp]
 ].map(function(c){return{name:c[0],detail:c[1],run:c[2],kind:'command'};});
 const docs=state.docs.map(function(d){return{name:d.name,detail:d.path||'临时文本',run:function(){openDocument(d.id,false);},kind:'file'};});
 return commandsOnly?commands:docs.concat(commands);
}
function openPalette(commandsOnly){
 closeMenu();let entries=paletteEntries(commandsOnly),filtered=entries,selected=0;
 el('dialog-root').innerHTML='<div class="backdrop palette-backdrop"><section class="dialog command-palette" role="dialog" aria-modal="true" aria-label="搜索文件或命令"><input id="palette-query" placeholder="'+(commandsOnly?'输入命令名称':'搜索文件，或输入 > 查找命令')+'" aria-label="命令查询"><div class="palette-results"></div><div class="palette-hint">↑ ↓ 选择　Enter 打开　Esc 关闭</div></section></div>';
 function paint(){const box=el('dialog-root').querySelector('.palette-results');box.innerHTML=filtered.slice(0,30).map(function(e,i){return'<button class="palette-item '+(i===selected?'selected':'')+'" data-palette="'+i+'">'+icon(e.kind==='file'?'file':'chevron')+'<strong>'+esc(e.name)+'</strong><span>'+esc(e.detail)+'</span></button>';}).join('')||'<div class="settings-empty" style="padding:25px">没有匹配项</div>';box.querySelectorAll('[data-palette]').forEach(function(b){b.onclick=function(){const entry=filtered[Number(b.dataset.palette)];closeDialog();entry.run();};});}
 paint();const input=el('palette-query');input.focus();
 input.oninput=function(){const q=input.value.trim().toLowerCase(),only=q.startsWith('>'),needle=only?q.slice(1).trim():q;filtered=entries.filter(function(e){return(!only||e.kind==='command')&&(e.name+' '+e.detail).toLowerCase().includes(needle);});selected=0;paint();};
 input.onkeydown=function(e){if(e.key==='ArrowDown'){e.preventDefault();selected=Math.min(selected+1,Math.min(29,filtered.length-1));paint();}if(e.key==='ArrowUp'){e.preventDefault();selected=Math.max(0,selected-1);paint();}if(e.key==='Enter'&&filtered[selected]){e.preventDefault();const entry=filtered[selected];closeDialog();entry.run();}if(e.key==='Escape')closeDialog();};
}
function perform(action){if(action==='new')newDocument();if(action==='open')el('file-input').click();if(action==='folder')el('folder-input').click();}
let chordUntil=0,lastEscape=0;
function handleKeyboard(e){
 if(e.isComposing||state.composing||e.keyCode===229)return;
 const key=e.key.toLowerCase(),ctrl=e.ctrlKey||e.metaKey;
 if(key==='escape'){
  if(el('dialog-root').firstChild){closeDialog();e.preventDefault();return;}
  if(el('menu-root').firstChild){closeMenu();e.preventDefault();return;}
  if(state.find){closeFind();e.preventDefault();return;}
  if(state.multi){clearMulti();e.preventDefault();return;}
  if(state.zen&&Date.now()-lastEscape<800){toggleZen();e.preventDefault();}
  lastEscape=Date.now();return;
 }
 const textField=e.target.matches('input,select')||e.target.closest('.dialog,.find-widget');
 if(chordUntil>Date.now()){
  chordUntil=0;if(key==='z'){e.preventDefault();toggleZen();return;}if(ctrl&&key==='b'){e.preventDefault();toggleSidebar();return;}if(ctrl&&key==='o'){e.preventDefault();el('folder-input').click();return;}
 }
 if(!ctrl){if(e.shiftKey&&e.altKey&&e.key==='ArrowDown'&&!textField){e.preventDefault();duplicateLine();}return;}
 if(textField&&['a','c','x','v','z','y'].includes(key))return;
 let action=null;
 if(key==='k'&&!e.shiftKey){action=function(){chordUntil=Date.now()+1500;toast('等待组合键：Z / Ctrl+B / Ctrl+O');};}
 else if(key==='p')action=function(){openPalette(e.shiftKey);};
 else if(key==='f')action=e.shiftKey?function(){state.sidebar='search';state.sidebarVisible=true;state.scene=state.groups.length>1?'split':'main';renderAll();el('workspace-query')?.focus();}:function(){openFind(false);};
 else if(key==='h')action=function(){openFind(true);};
 else if(key==='n')action=e.shiftKey?newWindow:newDocument;
 else if(key==='o')action=function(){el('file-input').click();};
 else if(key==='s')action=function(){saveCurrent(e.shiftKey);};
 else if(key==='z'&&!textField)action=function(){historyAction(e.shiftKey);};
 else if(key==='y'&&!textField)action=function(){historyAction(true);};
 else if(key===',')action=function(){switchScene('settings');};
 else if(key==='\\')action=splitCurrent;
 else if(key==='b'&&!textField)action=function(){if(currentDoc()&&groupMode(currentGroup(),currentDoc())==='wysiwyg'&&e.target.closest('.rich-document'))formatRich('bold');else toggleSidebar();};
 else if(key==='i'&&!textField)action=function(){formatRich('italic');};
 else if(key==='d'&&!textField)action=function(){addNextSelection(false);};
 else if(key==='l'&&e.shiftKey&&!textField)action=function(){addNextSelection(true);};
 else if(key==='g')action=goToLine;
 else if(key==='w')action=function(){closeTab(state.activeGroup,currentGroup().active);};
 else if(key==='tab')action=function(){cycleTab(e.shiftKey?-1:1);};
 else if(/^[123]$/.test(key))action=function(){focusGroup(Number(key)-1);};
 if(action){e.preventDefault();action();}
}

 el('activity-files').innerHTML=icon('file');el('activity-search').innerHTML=icon('search');el('activity-settings').innerHTML=icon('settings');
 buildMenus();
 document.querySelectorAll('[data-scene]').forEach(function(b){b.onclick=function(){switchScene(b.dataset.scene);};});

 el('activity-search').onclick=function(){state.scene=state.groups.length>1?'split':'main';state.sidebar='search';state.sidebarVisible=true;renderAll();el('workspace-query')?.focus();};
 el('activity-settings').onclick=function(){switchScene('settings');};
 el('quick-open').onclick=function(){openPalette(false);};el('prototype-help').onclick=showPrototypeHelp;
 el('scenario-trigger').onclick=function(e){showScenarios(e.currentTarget);};
 el('exit-zen').onclick=toggleZen;
 el('file-input').onchange=function(e){loadFiles(e.target.files,false);e.target.value='';};
 el('folder-input').onchange=function(e){loadFiles(e.target.files,true);e.target.value='';};
 el('minimize').onclick=function(){el('app').style.display='none';el('minimized-state').hidden=false;};
 el('restore-window').onclick=function(){el('app').style.display='flex';el('minimized-state').hidden=true;};
 el('maximize').onclick=function(){document.body.classList.toggle('maximized');};
 el('close-window').onclick=function(){showDialog('结束本次演示','<p>关闭此对话框可继续审阅；浏览器页面可以直接关闭。原型已按当前设置保存浏览器会话。</p>',[['继续审阅',closeDialog,'primary']]);};
 el('sidebar-resizer').onpointerdown=function(e){const h=e.currentTarget,start=e.clientX,width=el('sidebar').offsetWidth;h.setPointerCapture(e.pointerId);h.onpointermove=function(ev){document.documentElement.style.setProperty('--sidebar-width',Math.max(180,Math.min(420,width+ev.clientX-start))+'px');};h.onpointerup=function(){h.onpointermove=null;};};
 document.addEventListener('pointerdown',function(e){if(!e.target.closest('.menu,.menubar-button,#scenario-trigger,.group-more,.tab,#status-right'))closeMenu();});
 document.addEventListener('keydown',handleKeyboard);
 window.addEventListener('beforeunload',persist);
 const windowDoc=new URL(location.href).searchParams.get('texziWindow');
 if(windowDoc&&docById(windowDoc)){state.groups=[makeGroup('g1',[windowDoc])];state.activeGroup='g1';state.scene='main';}
 renderAll();
 if(restoredSession)setTimeout(function(){toast('已恢复此浏览器保存的演示会话。帮助菜单可重置样本。');},250);
}
window.texziReview={
 getState:function(){return state;},searchCore,parseMarkdown,serializeBlock,expandReplacement,
 switchScene,scenario,toggleMarkdown,historyAction,editDocument,openFind,runFind,
 reset:function(){state.docs=initialDocuments();state.settings=Object.assign({},defaultSettings);state.find=null;state.multi=null;switchScene('main');},
 capabilities:{native:false,storage:'browser-localStorage',regex:'JavaScript RegExp in Worker',fileEncoding:'UTF-8',maxImportMiB:5,maxGroups:3}
};
boot();
