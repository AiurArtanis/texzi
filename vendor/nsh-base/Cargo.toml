# Derived from fixed NSH commit; only workspace inheritance expanded.
[package]
name = "nsh-base"
description = "Behavior and infrastructure foundations of NSH apps' UI (`nsh/base`), unstyled: navigation, safe areas, dialogs, the keyboard and the status bar."
version = "0.5.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 AND MIT"
homepage = "https://nsh.dev"
repository = "https://github.com/longbridge/nsh"
publish = false
[features]
default = ["editor", "highlight", "plot", "rich-editor", "term"]
editor = ["dep:ropey", "dep:imara-diff"]
rich-editor = []
term = ["dep:vte"]
plot = []
highlight = ["dep:syntect", "dep:two-face"]
emoji-picker = []
math = ["dep:ratex-parser", "dep:ratex-layout", "dep:ratex-types", "dep:ratex-font", "dep:ttf-parser", "dep:zstd"]
[dependencies]
zstd = { version = "0.14", default-features = false, optional = true }
nsh-core = { version = "0.5.1", git = "https://github.com/longbridge/nsh", rev = "224d9a795c7ac9d10d75750de9351adac5549675" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rustc-hash = { version = "2.1" }
serde_json = { version = "1" }
serde = { version = "1", features = ["derive"] }
markdown = { version = "1.0.0" }
html5ever = { version = "0.27" }
markup5ever_rcdom = { version = "0.3.0" }
regex = { version = "1" }
ropey = { version = "1.6", optional = true }
unicode-segmentation = { version = "1.13" }
imara-diff = { version = "0.2", optional = true }
unicode-width = { version = "0.2.2" }
vte = { version = "0.15", default-features = false, optional = true }
log = { version = "0.4" }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"], optional = true }
ratex-parser = { version = "0.1.15", optional = true }
ratex-layout = { version = "0.1.15", optional = true }
ratex-types = { version = "0.1.15", optional = true }
ratex-font = { version = "0.1.15", optional = true }
ttf-parser = { version = "0.25", optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"], optional = true }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load", "regex-onig"], optional = true }
