# Derived from the pinned NSH manifest. Workspace entries are expanded for this fork.
[package]
name = "nsh-platform-windows"
description = "Windows backend (Win32, Direct2D, DirectWrite): view mounting, text engine, input, standalone app."
version = "0.7.1"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://nsh.dev"
repository = "https://github.com/longbridge/nsh"
publish = false

[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "svg", "net", "webview", "media"]
js = ["nsh-engine/js-core"]
dev = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "dep:nsh-dev", "dep:nsh-testing", "svg", "net", "webview", "media"]
webview = ["dep:webview2-com"]
media = ["windows/Win32_Media_Audio", "windows/Win32_Media_Audio_XAudio2", "windows/Win32_Media_MediaFoundation"]
shader = ["nsh-engine/shader"]
editor = ["nsh-base/editor"]
rich-editor = ["nsh-base/rich-editor"]
plot = ["nsh-base/plot"]
term = ["nsh-base/term"]
highlight = ["nsh-base/highlight"]
math = ["nsh-base/math"]
emoji-picker = ["nsh-base/emoji-picker"]
zlib = ["js", "nsh-engine/zlib"]
crypto = ["js", "nsh-engine/crypto"]
websocket = ["nsh-core/websocket"]
updater = ["nsh-core/updater"]
svg = ["nsh-core/svg"]
net = ["nsh-core/loader", "nsh-engine/net"]

[dependencies]
log = { version = "0.4" }

[target.'cfg(windows)'.dependencies]
nsh-core = { version = "0.7.1", git = "https://github.com/longbridge/nsh", rev = "f78eace7af23a9c1c72605c7ee46204f57f3e8e6", features = ["animation"] }
nsh-engine = { version = "0.7.1", default-features = false, git = "https://github.com/longbridge/nsh", rev = "f78eace7af23a9c1c72605c7ee46204f57f3e8e6" }
nsh-base = { version = "0.7.1", default-features = false, git = "https://github.com/longbridge/nsh", rev = "f78eace7af23a9c1c72605c7ee46204f57f3e8e6" }
windows = { version = "0.62", features = ["std", "Data_Xml_Dom", "Foundation_Numerics", "System", "UI_Composition", "UI_Composition_Desktop", "UI_Notifications", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Imaging_D2D", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = { version = "0.62" }
windows-numerics = { version = "0.3" }
webview2-com = { version = "0.39", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
rustc-hash = { version = "2.1" }
serde_json = { version = "1" }
url = { version = "2.5" }
ttf-parser = { version = "0.25" }
crossbeam-channel = { version = "0.5" }
nsh-dev = { version = "0.7.1", git = "https://github.com/longbridge/nsh", rev = "f78eace7af23a9c1c72605c7ee46204f57f3e8e6", features = ["client"], optional = true }
nsh-testing = { version = "0.7.1", default-features = false, git = "https://github.com/longbridge/nsh", rev = "f78eace7af23a9c1c72605c7ee46204f57f3e8e6", features = ["agent"], optional = true }
